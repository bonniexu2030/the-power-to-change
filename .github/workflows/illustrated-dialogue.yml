name: Full illustrated dialogue regression
on:
  workflow_dispatch:
  push:
    branches:
      - feature/full-illustrated-dialogue-15-scenes
  pull_request:
    branches:
      - main
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all scenes, dialogue, assets and original game state wiring
        run: node --test tests/illustrated-conversion.test.cjs tests/poetic-ending.test.cjs tests/onboarding-map-removal.test.cjs
  browser-flow:
    runs-on: ubuntu-latest
    needs: static-integrity
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local static game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ptc-http.log 2>&1 &
      - name: Exercise every illustrated chapter and saved choice flow
        run: npx playwright test tests/illustrated-flow.spec.cjs tests/poetic-ending.spec.cjs tests/onboarding-map-removal.spec.cjs --workers=1 --reporter=line

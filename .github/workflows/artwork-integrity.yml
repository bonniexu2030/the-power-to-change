name: Artwork and game integrity
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved portraits, scenes, and gameplay wiring
        run: node --test tests/artwork-integrity.test.cjs
